[project]
name = "datasource-semantic-migration"
version = "0.1.0"
description = "Deterministic Tableau datasource to Databricks Metric View workflow"
requires-python = ">=3.11"
dependencies = ["lark==1.3.1", "PyYAML>=6.0"]

[project.scripts]
datasource-semantic-migrate = "datasource_semantic_migration.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/datasource_semantic_migration"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
