bundle:
  name: bi-migration-review

variables:
  volume_full_name:
    description: Three-level Unity Catalog volume name used for migration assets
  dashboard_import_job_id:
    description: Workspace-managed Dashboard Import Job ID
  semantic_build_job_id:
    description: Workspace-managed Semantic Build Job ID

resources:
  apps:
    app:
      name: 'bi-migration-review'
      description: 'Review BI migration groups, mappings, and readiness evidence'
      source_code_path: ./app/bi-migration-review

      # Start the app automatically on deploy.
      lifecycle:
        started: true
      resources:
        - name: files
          uc_securable:
            securable_full_name: ${var.volume_full_name}
            securable_type: VOLUME
            permission: WRITE_VOLUME
        - name: inventory-job
          job:
            id: ${resources.jobs.inventory.id}
            permission: CAN_MANAGE_RUN
        - name: semantic-job
          job:
            id: ${var.semantic_build_job_id}
            permission: CAN_MANAGE_RUN
        - name: dashboard-import-job
          job:
            id: ${var.dashboard_import_job_id}
            permission: CAN_MANAGE_RUN
      user_api_scopes:
        - files.files
        - catalog.catalogs:read
        - catalog.schemas:read
        - catalog.tables:read

  jobs:
    inventory:
      name: '[${bundle.target}] BI migration inventory'
      performance_target: PERFORMANCE_OPTIMIZED
      tags:
        aidevkit_project: ai-dev-kit
      tasks:
        - task_key: inventory
          notebook_task:
            notebook_path: ./notebooks/inventory.py
            base_parameters:
              input_path: ''
              mapping_docs_path: ''
              target_metadata_path: ''
              output_path: ''
              run_id: ''
              source_base_uri: ''
          environment_key: default
      environments:
        - environment_key: default
          spec:
            environment_version: '4'
            dependencies:
              - ./dist/*.whl

artifacts:
  default:
    type: whl
    path: .
    build: uv build

targets:
  default:
    default: true
    variables:
      volume_full_name: main.superstore.tableau
      dashboard_import_job_id: '0'
      semantic_build_job_id: '0'
    workspace:
      host: https://<workspace-host>
