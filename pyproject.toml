[project]
name = "bi-migration-blueprint"
version = "0.1.0"
description = "Inventory and mapping foundation for scalable BI migrations"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.scripts]
bi-migrate = "bi_migration.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bi_migration"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
